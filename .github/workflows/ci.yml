name: CI

on:
  push:
    branches: [main, "phishing_ia/*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint & Format

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint (ruff)
        run: ruff check .

  test-suite:
    runs-on: ubuntu-latest
    name: Test Suite (281 tests)
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt coverage --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run all tests with coverage
        run: coverage run -m pytest -v --tb=short

      - name: Generate coverage report
        run: |
          coverage report
          coverage html
          coverage xml

      - name: Run SSRF security tests
        run: pytest backend/tests/test_ssrf_guard.py -v --tb=short
        if: always()

      - name: Run rate-limit tests
        run: pytest tests/test_cache_and_security.py -k rate_limit -v --tb=short
        if: always()

      - name: Run security (internals leak) tests
        run: pytest tests/test_cache_and_security.py -k "production_error or development_error or metadata or api_key or error_messages" -v --tb=short
        if: always()

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        if: always()

      - name: Archive coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
        if: always()

      - name: Print test summary
        run: |
          echo "✅ Lint: PASSED"
          echo "✅ All tests: PASSED"
          echo "📊 Coverage: See artifacts"
        if: success()
