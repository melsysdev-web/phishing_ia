<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Opciones — AI Phishing Detector</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="page">

    <header class="header">
      <span class="header-icon">🛡️</span>
      <div>
        <h1 class="header-title">AI Phishing Detector</h1>
        <p class="header-sub">Configuración</p>
      </div>
    </header>

    <main class="main">

      <!-- Servidor -->
      <section class="card">
        <h2 class="card-title">Servidor de análisis</h2>
        <p class="card-desc">
          URL del servidor que procesa las peticiones de análisis.
        </p>

        <div class="field">
          <label class="label" for="backendUrl">URL del servidor</label>
          <div class="input-row">
            <input
              type="url"
              id="backendUrl"
              class="input"
              placeholder="https://tu-servidor.ejemplo.com"
              spellcheck="false"
              autocomplete="off"
            />
            <button class="btn-secondary" id="testBtn">Probar conexión</button>
          </div>
          <p class="field-status" id="httpWarning"></p>
          <p class="field-status" id="testStatus"></p>
        </div>
      </section>

      <!-- API Key -->
      <section class="card">
        <h2 class="card-title">Autenticación</h2>
        <p class="card-desc">
          Clave de acceso al servidor. Déjala vacía si no aplica.
        </p>

        <div class="field">
          <label class="label" for="apiKey">API Key</label>
          <div class="input-row">
            <input
              type="password"
              id="apiKey"
              class="input"
              placeholder="Vacío = sin autenticación"
              spellcheck="false"
              autocomplete="off"
            />
            <button class="btn-secondary" id="toggleKey">Mostrar</button>
          </div>
        </div>
      </section>

      <!-- Acciones -->
      <div class="actions">
        <button class="btn-ghost" id="resetBtn">Restablecer valores</button>
        <button class="btn-primary" id="saveBtn">Guardar cambios</button>
      </div>
      <p class="save-feedback" id="saveFeedback"></p>

    </main>
  </div>
  <script src="../config.js"></script>
  <script src="options.js"></script>
</body>
</html>
