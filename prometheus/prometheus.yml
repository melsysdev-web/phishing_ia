global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # "backend" es el nombre del servicio en docker-compose.yml — Compose lo
  # resuelve por DNS interno, no requiere localhost/puerto publicado.
  - job_name: "phishing-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
